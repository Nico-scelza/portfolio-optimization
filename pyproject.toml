[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-optimization"
version = "0.2.0"
description = "Stateless multi-asset portfolio optimization engine (Annualized DCF + Black-Litterman, Weekly W-FRI VIX-Regime Covariance, ERC/HRP/Sharpe/MinVar/CVaR, Fixed Income YTM & IOL Quotes, Multi-Broker Rebalancing)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2.1",
    "scipy",
    "scikit-learn",
    "requests",
    "urllib3",
    "beautifulsoup4",
    "yfinance",
    "matplotlib",
]

[project.optional-dependencies]
notebook = [
    "ipython",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
